name: site

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aherkstroeter/kubernetes-cloudlab
          ref: master
          ssh-key: ${{ secrets.CLUSTER_DEPLOY_KEY }}
          path: cluster
          fetch-depth: 0

      - name: record the site sha
        working-directory: cluster
        run: |
          git config user.name "Anselm Herkströter"
          git config user.email "anselmherkstroeter@protonmail.com"
          git pull --rebase origin master
          mkdir -p 02_ArgoCD/03_workloads/www
          printf '%s\n' "${{ github.sha }}" > 02_ArgoCD/03_workloads/www/source.txt
          git add 02_ArgoCD/03_workloads/www/source.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "MOD set the site source"
          git push origin HEAD:master
          git push origin HEAD:main
