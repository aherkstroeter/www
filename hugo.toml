baseURL = "https://anselmherkstroeter.com/"
locale = "en"
title = "Anselm Herkströter"
enableRobotsTXT = true
enableEmoji = false
disableKinds = ["taxonomy", "term"]

[permalinks]
  writing = "/:slug/"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  page = ["HTML"]

[params]
  description = "This site is a work in progress."

[markup]
  [markup.highlight]
    noClasses = false
    guessSyntax = false
    lineNos = false
    lineNumbersInTable = false
    tabWidth = 2
  [markup.goldmark]
    [markup.goldmark.extensions]
      typographer = false
      linkify = false
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = false
      xhtml = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
